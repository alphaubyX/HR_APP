name: Deploy HR app to FastComet

# Tests the app and uploads it by FTP to its Node.js app folder on the server.
# Needs these repository secrets: HR_FTP_SERVER, HR_FTP_USERNAME, HR_FTP_PASSWORD, and
# HR_FTP_DIR (the app folder relative to the FTP login, e.g. "broadwing-hr/").
# Until they are set, this workflow does nothing.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-hr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that FTP details are set
        id: check
        env:
          SERVER: ${{ secrets.HR_FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "HR_FTP_SERVER is not set: skipping the HR deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Test
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm test

      - name: Restart trigger for the Node app
        if: steps.check.outputs.ready == 'true'
        run: mkdir -p tmp && date > tmp/restart.txt

      - name: Upload via FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HR_FTP_SERVER }}
          username: ${{ secrets.HR_FTP_USERNAME }}
          password: ${{ secrets.HR_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.HR_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            data/**
            test/**
            agent/**
            .env
            .github/**
            LICENSE
            *.md
