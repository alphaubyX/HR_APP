name: Test and upload to the web server

# Every push to main: run the tests, then upload the changed files straight to the HR app's folder
# on the web server (FastComet / cPanel) over FTPS, restart the app, and check the site answers.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER      e.g. ftp.yourdomain.com (or the server's host name)
#   FTP_USERNAME    an FTP account whose home folder IS the app folder, e.g. hrdeploy@yourdomain.com
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  optional: the app folder relative to the FTP login, if the account starts higher up
#                   (e.g. "broadwing-hr/"). Leave it out when the FTP account opens in the app folder.
# Repository variable (same page → Variables), optional:
#   SITE_URL        e.g. https://hr.yourdomain.com — checked after each upload.
#
# Without the secrets, only the tests run.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  upload:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check the FTP details are set
        id: check
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "::notice::FTP_SERVER secret is not set, so nothing was uploaded. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      # cPanel (Passenger) restarts the Node app when tmp/restart.txt changes
      - name: Restart trigger
        if: steps.check.outputs.ready == 'true'
        run: mkdir -p tmp && date > tmp/restart.txt

      # Only changed files are sent (the action keeps a small state file on the server).
      # node_modules is never uploaded: cPanel manages it — click "Run NPM Install" when package.json changes.
      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            data/**
            test/**
            agent/**
            .env
            .env.example
            *.md
            LICENSE

      - name: Check the site is up
        if: steps.check.outputs.ready == 'true' && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            if body=$(curl -fsS --max-time 20 "${SITE_URL%/}/api/health"); then
              echo "Site is up: $body"
              exit 0
            fi
            echo "Not answering yet (try $i)…"
          done
          echo "::error::${SITE_URL} did not answer /api/health after the upload. Check the app's stderr.log in cPanel, or click Run NPM Install and Restart."
          exit 1
